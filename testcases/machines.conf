# libguestfs machine definitions for the Qinux test suite.
#
# Consumed by Arch's qemu-tests framework:
#
#   QT_QEMU_BINARY, QT_QEMU_EXTRA_ARGS
#
# The disk image size matters more than it looks. The ISO is about 3 GB and the
# installed system needs room to write a fresh filesystem plus a swap file, so
# anything under 12 GB makes the partitioning step fail with no room rather
# than with a real error.

[qinux-dailylive]
# 16 GB. Comfortable for btrfs, which will not lay out a filesystem that fills
# more than 90% of its device.
disk_img="qinux-dailylive/disk.qcow2"
size="16G"

guest_os="linux"
iso_name="qinux-dailylive.iso"
iso_uri="${TEST_ISO:-qinux-dailylive.iso}"

# KVM when the host allows it, TCG otherwise. A TCG run is roughly ten times
# slower, which turns a twenty minute test into three hours, so the framework is
# told to skip rather than to run slowly.
kvm=auto

# The VM is deliberately small. A test needing 8 GB never runs on a CI runner,
# and a test needing 2 GB proves the ISO fits on a modest machine.
memory="2048"
cpus="2"

# Headless. A graphical console makes no difference to the result and doubles
# the CI cost.
console="serial"

# Required for the OCR steps: the test screenshots the VM's console, and
# without a VGA device there is nothing to screenshot.
graphics="vga"
